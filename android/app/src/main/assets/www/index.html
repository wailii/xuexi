<!doctype html>
<html lang="zh-CN" class="app">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<script>
/* 页面出错别白屏：贴一张黄条写清是什么错、手机浏览器内核的版本，截图就能查。写成老语法，老内核也能跑 */
(function () {
  var v = +((navigator.userAgent.match(/Chrome\/(\d+)/) || [])[1] || 0);
  function show(msg) {
    var x = document.getElementById("fatal");
    if (!x) { x = document.createElement("div"); x.id = "fatal"; x.onclick = function () { x.parentNode.removeChild(x); }; (document.body || document.documentElement).appendChild(x); }
    x.textContent = "出错了：" + msg + "（手机浏览器内核 Chrome " + (v || "?") + "，截图发给作者）";
  }
  window.__fatal = show;
  window.addEventListener("error", function (e) { if (e.message) show(e.message); });
  window.addEventListener("unhandledrejection", function (e) { var r = e.reason; if (r && /TypeError|ReferenceError|SyntaxError|RangeError/.test(r.name)) show(r.message); });
  if (v && v < 80) window.addEventListener("DOMContentLoaded", function () { show("这台手机的系统浏览器内核太旧，去应用商店更新「Android System WebView」再打开"); });
})();
</script>

<title>学习</title>
<link rel="stylesheet" href="fonts/lxgw/lxgw.css">
<link rel="stylesheet" href="fonts.css">
<style>
  :root { --top: 40px; --bot: 0px; --bg: #ffffff; --ink: #0b0b0c; --ink2: #55555a; --mute: #8a8a8e; --line: #ececec; --soft: #f4f4f5; --acc: #2f4bff; --acc-soft: #eef0ff; --hand: Hand, "LXGW WenKai Screen", "Noto Sans SC", sans-serif; }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; overflow: hidden; background: var(--bg); }
  body { font-family: Geist, "Noto Sans SC", sans-serif; color: var(--ink); -webkit-font-smoothing: antialiased; }
  button, input { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; outline: none; }
  .mono { font-family: "Geist Mono", "Noto Sans SC", monospace; }

  .app { position: relative; width: 100%; height: 100%; height: 100dvh; margin: 0 auto; overflow: hidden; background: var(--bg); }
  @media (min-width: 600px) {
    body { background: #e9e9eb; display: grid; place-items: center; }
    .app { width: 390px; height: min(844px, 100dvh - 32px); border-radius: 44px; }
  }
  .sb { position: absolute; top: 0; left: 0; right: 0; height: 40px; z-index: 30; display: flex; align-items: center; justify-content: space-between; padding: 6px 26px 0; font-size: 15px; font-weight: 600; pointer-events: none; }
  .sb i { display: inline-block; width: 24px; height: 11px; border: 1.5px solid var(--ink); border-radius: 3.5px; position: relative; vertical-align: -1px; }
  .sb i::after { content: ""; position: absolute; top: 1.5px; right: 6px; bottom: 1.5px; left: 1.5px; background: var(--ink); border-radius: 1.5px; }
  .views { position: absolute; top: var(--top); right: 0; bottom: 0; left: 0; }
  .view { position: absolute; top: 0; right: 0; bottom: 0; left: 0; display: flex; flex-direction: column; background: var(--bg); overflow: hidden; }
  .scroll { flex: 1; overflow-y: auto; overflow-x: hidden; scrollbar-width: none; }
  .scroll::-webkit-scrollbar { display: none; }

  /* ── 遮罩升起的大字 ── */
  .mask { display: block; overflow: hidden; padding-bottom: .06em; }
  .mask > span { display: inline-block; }
  .pre .mask > span { transform: translateY(105%); }
  h1.big { font-size: 56px; font-weight: 900; letter-spacing: -0.045em; line-height: .98; display: flex; }
  h1.big .mask { display: inline-block; }
  .live { margin-top: 10px; display: flex; align-items: center; gap: 8px; font-family: "Geist Mono", "Noto Sans SC", monospace; font-size: 12px; color: var(--mute); letter-spacing: .02em; }
  .live b { width: 7px; height: 7px; border-radius: 50%; background: var(--acc); animation: beat 1s infinite cubic-bezier(.3,0,.2,1); }
  .live b.off { background: var(--line); animation: none; }
  @keyframes beat { 0%, 100% { transform: scale(1); } 15% { transform: scale(1.5); } 40% { transform: scale(1); } }
  .sect { display: flex; align-items: center; gap: 10px; margin: 30px 2px 4px; font-family: "Geist Mono", "Noto Sans SC", monospace; font-size: 11.5px; color: var(--mute); letter-spacing: .08em; }
  .sect::after { content: ""; flex: 1; height: 1px; background: var(--line); }
  .sect .r { order: 2; letter-spacing: 0; font-size: 12.5px; font-weight: 600; color: var(--ink); font-family: Geist, "Noto Sans SC", sans-serif; display: flex; align-items: center; gap: 3px; }
  .sect .r svg { width: 14px; height: 14px; }
  .press { transition: transform .45s var(--snap, cubic-bezier(.34,1.4,.5,1)); }
  .press:active { transform: scale(.97); transition-duration: .08s; }

  /* ── 首页 ── */
  .top { flex: none; display: flex; justify-content: space-between; align-items: flex-start; padding: 8px 20px 14px; }
  .slot { width: 104px; height: 44px; margin-top: 6px; flex: none; }
  .home .scroll { padding: 0 16px 120px; }
  .hero { position: relative; cursor: pointer; }
  .hero .lab { margin: 4px 2px 10px; }
  .shot { position: relative; height: 210px; border-radius: 28px; overflow: hidden; background: var(--soft); }
  .shot img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .pre .shot { clip-path: inset(46% 46% 46% 46% round 999px); }
  .pre .shot img { transform: scale(1.18); }
  .hrow { display: flex; align-items: flex-end; justify-content: space-between; margin: 14px 2px 6px; }
  .num-xl { font-size: 92px; font-weight: 800; letter-spacing: -0.06em; line-height: .8; }
  .stat { text-align: right; padding-bottom: 6px; }
  .stat .n { font-size: 30px; font-weight: 700; letter-spacing: -0.03em; color: var(--acc); font-variant-numeric: tabular-nums; line-height: 1; }
  .stat .n.ink { color: var(--ink); }
  .stat .l { margin-top: 5px; font-size: 12px; color: var(--mute); }
  .hero h2 { margin: 12px 2px 0; font-size: 25px; font-weight: 900; letter-spacing: -0.02em; line-height: 1.28; }
  .hero p { margin: 8px 2px 0; font-size: 14px; line-height: 1.6; color: var(--ink2); }
  .it { display: grid; grid-template-columns: 54px 1fr 20px; gap: 6px; align-items: start; padding: 16px 2px 17px; border-bottom: 1px solid var(--line); cursor: pointer; }
  .it .no { font-size: 30px; font-weight: 700; letter-spacing: -0.05em; color: #c8c8cc; line-height: 1; padding-top: 1px; transition: color .3s; }
  .it:active .no { color: var(--ink); }
  .it h3 { font-size: 19px; font-weight: 800; line-height: 1.3; letter-spacing: -0.01em; }
  .it .sub { margin-top: 2px; font-size: 13.5px; color: var(--ink2); }
  .meta { margin-top: 10px; display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--mute); font-variant-numeric: tabular-nums; }
  .meta .acc { color: var(--acc); font-weight: 600; }
  .bar { flex: none; width: 96px; height: 3px; border-radius: 3px; background: var(--line); overflow: hidden; }
  .bar i { display: block; height: 100%; width: 100%; background: var(--ink); transform-origin: left; }
  .chev { width: 18px; height: 18px; margin-top: 8px; color: #c8c8cc; }

  /* ── 会变形的那一个元素：新课按钮 ⇄ 建课进度条 ── */
  .morph { position: absolute; z-index: 20; background: var(--ink); color: #fff; overflow: hidden; cursor: pointer; transition: opacity .25s; }
  .morph.away { opacity: 0; pointer-events: none; }
  .m-pill, .m-bar { position: absolute; top: 0; right: 0; bottom: 0; left: 0; display: flex; align-items: center; transition: opacity .22s, filter .22s; }
  .m-pill { justify-content: center; gap: 6px; font-size: 15px; font-weight: 600; white-space: nowrap; }
  .m-pill svg { width: 17px; height: 17px; }
  .m-bar { padding: 0 10px 0 12px; gap: 12px; opacity: 0; filter: blur(6px); pointer-events: none; }
  .morph.open .m-pill { opacity: 0; filter: blur(6px); pointer-events: none; }
  .morph.open .m-bar { opacity: 1; filter: none; pointer-events: auto; transition-delay: .12s; }
  .ring { width: 40px; height: 40px; flex: none; position: relative; }
  .ring svg { width: 40px; height: 40px; transform: rotate(-90deg); }
  .ring circle { fill: none; stroke-width: 3; }
  .ring .bg { stroke: rgba(255,255,255,.18); }
  .ring .fg { stroke: #fff; stroke-linecap: round; transition: stroke-dashoffset .6s cubic-bezier(.16,1,.3,1); }
  .ring b { position: absolute; top: 0; right: 0; bottom: 0; left: 0; display: grid; place-items: center; font: 600 12px "Geist Mono", monospace; }
  .ring .ok { position: absolute; top: 5px; right: 5px; bottom: 5px; left: 5px; border-radius: 50%; background: #fff; display: none; place-items: center; }
  .ring .ok::after { content: ""; width: 11px; height: 6px; border: solid var(--ink); border-width: 0 0 2.2px 2.2px; transform: translateY(-2px) rotate(-45deg); }
  .morph.done .ring .ok { display: grid; } .morph.done .ring b, .morph.done .ring svg { display: none; }
  .m-txt { flex: 1; min-width: 0; }
  .m-txt b { display: block; font-size: 11px; font-weight: 500; color: rgba(255,255,255,.55); font-family: "Geist Mono", "Noto Sans SC", monospace; letter-spacing: .02em; }
  .m-txt span { display: block; margin-top: 3px; font-size: 14.5px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .m-go { height: 36px; padding: 0 14px; border-radius: 18px; background: #fff; color: var(--ink); font-size: 13px; font-weight: 700; display: none; align-items: center; flex: none; }
  .morph.done .m-go { display: flex; }
  .m-chev { width: 18px; height: 18px; color: rgba(255,255,255,.55); flex: none; }
  .morph.done .m-chev { display: none; }

  /* ── 分类页 ── */
  .nav { flex: none; height: 48px; display: flex; align-items: center; padding: 0 10px; }
  .back { width: 40px; height: 40px; border-radius: 50%; display: grid; place-items: center; }
  .back svg { width: 22px; height: 22px; }
  .cat .scroll { padding: 0 16px 40px; }
  .cat .top { padding: 0 4px 6px; }
  .stats { display: grid; grid-template-columns: repeat(3, 1fr); margin: 18px 2px 0; }
  .stats div { padding-right: 8px; }
  .stats .n { font-size: 40px; font-weight: 800; letter-spacing: -0.05em; line-height: 1; font-variant-numeric: tabular-nums; }
  .stats .n.acc { color: var(--acc); }
  .stats .l { margin-top: 6px; font-size: 12px; color: var(--mute); }
  .map { display: grid; grid-template-columns: repeat(13, 1fr); gap: 4px; margin: 22px 0 0; }
  .map.wide { grid-template-columns: repeat(12, 1fr); }
  .cell { aspect-ratio: 1; min-height: 22px; border-radius: 6px; background: var(--soft); position: relative; cursor: pointer; }
  .cell.mastered { background: var(--ink); }
  .cell.learned { background: #b9b9bd; }
  .cell.learning { background: var(--acc); }
  .cell.available { background: #fff; box-shadow: inset 0 0 0 1.5px var(--ink); }
  .cell.due::after { content: ""; position: absolute; right: -2px; top: -2px; width: 8px; height: 8px; border-radius: 50%; background: var(--acc); border: 2px solid #fff; }
  .cell.sel { outline: 2px solid var(--ink); outline-offset: 2px; }
  .legend { display: flex; flex-wrap: wrap; gap: 4px 12px; margin: 12px 2px 0; font-size: 11.5px; color: var(--mute); }
  .legend span { display: flex; align-items: center; gap: 5px; }
  .legend i { width: 9px; height: 9px; border-radius: 3px; background: var(--soft); }
  .mapcap { margin: 12px 2px 0; font-size: 14px; line-height: 1.5; }
  .mapcap:empty { display: none; }
  .mapcap b { font-family: "Geist Mono", monospace; font-weight: 600; margin-right: 6px; }
  .mapcap small { display: block; font-size: 12px; color: var(--mute); }
  .go { width: 100%; margin-top: 18px; min-height: 60px; border-radius: 30px; background: var(--ink); color: #fff; display: flex; align-items: center; gap: 12px; padding: 8px 8px 8px 22px; text-align: left; }
  .go div { flex: 1; min-width: 0; }
  .go span { display: block; font-size: 15.5px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .go small { display: block; margin-top: 2px; font-size: 12px; color: rgba(255,255,255,.6); }
  .go i { width: 44px; height: 44px; border-radius: 50%; background: #fff; display: grid; place-items: center; flex: none; }
  .go i svg { width: 18px; height: 18px; color: var(--ink); }
  .cv { display: grid; grid-template-columns: 48px 1fr auto; gap: 8px; padding: 15px 2px; border-bottom: 1px solid var(--line); cursor: pointer; }
  .cv .d { font-family: "Geist Mono", monospace; font-size: 12px; color: var(--mute); padding-top: 2px; }
  .cv .d.now { color: var(--acc); font-weight: 600; font-family: Geist, "Noto Sans SC", sans-serif; }
  .cv h4 { font-size: 15px; font-weight: 600; line-height: 1.45; }
  .cv .tg { font-family: "Geist Mono", "Noto Sans SC", monospace; font-size: 12px; color: var(--mute); padding-top: 2px; white-space: nowrap; }
  .cv .tg.acc { color: var(--acc); font-weight: 600; }
  .cv .more { grid-column: 2 / -1; display: grid; grid-template-rows: 0fr; transition: grid-template-rows .5s cubic-bezier(.16,1,.3,1); }
  .cv .more > div { overflow: hidden; }
  .cv .more ul { list-style: none; padding-top: 8px; font-size: 13.5px; line-height: 1.6; color: var(--ink2); }
  .cv .more li::before { content: "– "; color: var(--mute); }
  .cv.open .more { grid-template-rows: 1fr; }
  .empty { padding: 18px 2px; font-size: 14px; color: var(--mute); }

  /* ── 对话页 ── */
  .dtop { flex: none; display: flex; align-items: center; gap: 4px; padding: 2px 12px 8px 6px; }
  .dtop h1 { font-size: 16.5px; font-weight: 800; letter-spacing: -0.01em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .dtop small { display: block; margin-top: 1px; font-size: 11.5px; color: var(--mute); font-family: "Geist Mono", "Noto Sans SC", monospace; }
  .dtop > div { min-width: 0; flex: 1; }
  .phases { flex: none; position: relative; display: flex; margin: 0 14px; padding-bottom: 10px; border-bottom: 1px solid var(--line); }
  .phases .ind { position: absolute; top: 0; height: 30px; border-radius: 15px; background: var(--ink); }
  .phases span { position: relative; flex: 1; height: 30px; display: grid; place-items: center; font-size: 12.5px; font-weight: 600; color: #b4b4b8; white-space: nowrap; transition: color .25s; }
  .phases span.seen { color: var(--ink2); }
  .phases span.seen::after { content: ""; position: absolute; bottom: -1px; left: 50%; width: 4px; height: 4px; margin-left: -2px; border-radius: 50%; background: #c8c8cc; }
  .phases span.on { color: #fff; }
  .phases span.on::after { display: none; }
  .switch { display: flex; align-items: center; gap: 8px; margin: 22px 0 2px; font-size: 12.5px; line-height: 1.4; color: var(--mute); }
  .switch b { flex: none; height: 22px; padding: 0 9px; border-radius: 11px; background: var(--ink); color: #fff; font-size: 11.5px; font-weight: 700; display: grid; place-items: center; }
  .switch::after { content: ""; flex: 1; min-width: 12px; height: 1px; background: var(--line); }
  .quick { flex: none; display: flex; gap: 6px; padding: 8px 12px; overflow-x: auto; scrollbar-width: none; }
  .quick::-webkit-scrollbar { display: none; }
  .quick button { flex: none; height: 30px; padding: 0 12px; border-radius: 15px; border: 1px solid var(--line); background: #fff; font-size: 12.5px; color: var(--ink2); transition: transform .45s cubic-bezier(.34,1.4,.5,1); }
  .quick button:active { transform: scale(.94); transition-duration: .08s; }
  .chat .scroll { padding: 14px 16px 28px; scroll-behavior: auto; }
  .me { margin: 16px 0 0 auto; max-width: 80%; width: fit-content; padding: 10px 14px; border-radius: 18px 18px 4px 18px; background: var(--soft); font-size: 15px; line-height: 1.5; }
  .turn { margin-top: 16px; }
  .think { font-size: 13px; font-weight: 600; background: linear-gradient(90deg, var(--mute) 0%, var(--mute) 35%, var(--ink) 50%, var(--mute) 65%, var(--mute) 100%); background-size: 300% 100%; -webkit-background-clip: text; background-clip: text; color: transparent; animation: shim 1.6s linear infinite; }
  @keyframes shim { from { background-position: 100% 0; } to { background-position: -100% 0; } }
  .think.done { animation: none; background: none; color: var(--mute); }
  .steps { margin-top: 10px; border: 1px solid var(--line); border-radius: 14px; background: #fff; overflow: hidden; }
  .st { display: grid; grid-template-columns: 22px 1fr auto; gap: 4px 8px; align-items: center; padding: 10px 12px; font-size: 13.5px; color: var(--mute); }
  .st + .st { border-top: 1px solid var(--line); }
  .st .ic { width: 18px; height: 18px; border-radius: 50%; border: 1.5px solid var(--line); display: grid; place-items: center; }
  .st.run { color: var(--ink); }
  .st.run .ic { border-color: var(--acc); border-right-color: transparent; animation: rot .7s linear infinite; }
  @keyframes rot { to { transform: rotate(360deg); } }
  .st.bad { color: var(--ink); }
  .st.bad .ic { border-color: var(--mute); }
  .st.bad .ic::after { content: "!"; font-size: 11px; font-weight: 700; color: var(--mute); line-height: 1; }
  .st.ok { color: var(--ink); }
  .st.ok .ic { border: 0; background: var(--ink); }
  .st.ok .ic::after { content: ""; width: 7px; height: 4px; border: solid #fff; border-width: 0 0 1.8px 1.8px; transform: translateY(-1px) rotate(-45deg); }
  .st .r { font-family: "Geist Mono", "Noto Sans SC", monospace; font-size: 11.5px; color: var(--mute); white-space: nowrap; }
  .st .x { grid-column: 2 / -1; font-size: 12.5px; color: var(--ink2); line-height: 1.55; }
  .st .x:empty { display: none; }
  .st .x.mono { font-family: "Geist Mono", "Noto Sans SC", monospace; font-size: 11.5px; }
  .srcs { grid-column: 2 / -1; display: flex; flex-wrap: wrap; gap: 4px; }
  .srcs:empty { display: none; }
  .srcs span { display: flex; align-items: center; gap: 4px; padding: 2px 8px 2px 3px; border-radius: 999px; background: var(--soft); font-size: 11.5px; color: var(--ink2); }
  .srcs span i { width: 15px; height: 15px; border-radius: 50%; background: var(--ink); color: #fff; font-style: normal; font-size: 8.5px; font-weight: 700; display: grid; place-items: center; }
  .ans { margin-top: 12px; font-size: 15.5px; line-height: 1.75; }
  .ans p + p { margin-top: 8px; }
  .ans b { font-weight: 700; }
  .ans .num { font-family: "Geist Mono", monospace; font-size: 14px; padding: 0 4px; border-radius: 4px; background: var(--soft); }
  .cite { display: inline-grid; place-items: center; min-width: 17px; height: 17px; padding: 0 4px; margin: 0 1px; border-radius: 5px; background: var(--acc-soft); color: var(--acc); font-family: "Geist Mono", monospace; font-size: 10.5px; font-weight: 600; vertical-align: 2px; cursor: pointer; }
  .caret { display: inline-block; width: 9px; height: 9px; margin-left: 3px; border-radius: 50%; background: var(--ink); vertical-align: 1px; animation: blink 1s steps(1) infinite; }
  @keyframes blink { 50% { opacity: 0; } }
  .line { margin-top: 10px; font-family: "Geist Mono", "Noto Sans SC", monospace; font-size: 12px; color: var(--mute); display: flex; align-items: center; gap: 6px; }
  .line::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: var(--ink); }
  .tipl { margin-top: 12px; font-size: 13px; line-height: 1.6; color: var(--ink2); }
  .line.acc { color: var(--acc); } .line.acc::before { background: var(--acc); }
  .note { margin-top: 10px; width: fit-content; max-width: 100%; display: flex; gap: 8px; align-items: baseline; padding: 7px 11px; border-radius: 10px; background: var(--soft); font-size: 13px; line-height: 1.5; color: var(--ink2); }
  .note b { flex: none; font-family: "Geist Mono", "Noto Sans SC", monospace; font-size: 11.5px; font-weight: 600; color: var(--ink); }

  /* 题卡 */
  .q { margin-top: 12px; padding: 14px 12px 12px; border-radius: 16px; border: 1px solid var(--line); background: #fff; }
  .q.cur { box-shadow: 0 0 0 3px var(--acc-soft); border-color: #d9ddff; }
  .q .qt { font-size: 15.5px; font-weight: 700; line-height: 1.55; padding: 0 2px; }
  .q .stmt { margin: 2px 2px 0; padding-left: 12px; border-left: 3px solid var(--ink); font-size: 15.5px; font-weight: 600; line-height: 1.6; }
  .ops { display: grid; gap: 7px; margin-top: 12px; }
  .op { display: grid; grid-template-columns: 24px 1fr auto; align-items: center; gap: 10px; min-height: 46px; padding: 9px 12px 9px 10px; border-radius: 12px; border: 1px solid var(--line); text-align: left; font-size: 14.5px; line-height: 1.45; transition: border-color .2s, background .2s, opacity .3s, transform .45s cubic-bezier(.34,1.4,.5,1); }
  .op:active { transform: scale(.98); transition-duration: .08s; }
  .op i { width: 24px; height: 24px; border-radius: 8px; background: var(--soft); display: grid; place-items: center; font: 600 12px "Geist Mono", monospace; font-style: normal; color: var(--ink2); transition: background .2s, color .2s; }
  .op em { font-style: normal; font-family: "Geist Mono", "Noto Sans SC", monospace; font-size: 11.5px; color: var(--mute); }
  .op.pick { border-color: var(--ink); }
  .op.pick i { background: var(--ink); color: #fff; }
  .op.right { border-color: var(--acc); background: var(--acc-soft); }
  .op.right i { background: var(--acc); color: #fff; }
  .op.right em { color: var(--acc); }
  .op.wrong { color: var(--mute); }
  .op.wrong span { text-decoration: line-through; text-decoration-color: #c8c8cc; }

  /* 出处 */

  /* 装进安卓：用系统状态栏，不画假的 */
  html.app .sb { display: none; }

  .hbtn { width: 44px; height: 44px; margin-top: 6px; border-radius: 50%; display: grid; place-items: center; color: var(--ink2); flex: none; }
  .hbtn svg { width: 21px; height: 21px; }
  .top .acts { display: flex; gap: 6px; align-items: flex-start; }
  /* ── 手画（sketch.js）：每样三版轮流显示，线轻轻地抖 ── */
  @font-face { font-family: "Hand"; src: url(fonts/hand.woff2) format("woff2"); font-display: swap; }
  .v0 { animation: sk0 .42s step-end infinite; } .v1 { animation: sk1 .42s step-end infinite; } .v2 { animation: sk2 .42s step-end infinite; }
  @keyframes sk0 { 0% { opacity: 1; } 33.33% { opacity: 0; } }
  @keyframes sk1 { 0% { opacity: 0; } 33.33% { opacity: 1; } 66.66% { opacity: 0; } }
  @keyframes sk2 { 0% { opacity: 0; } 66.66% { opacity: 1; } }
  .still .v1, .still .v2, svg.drawing .v1, svg.drawing .v2 { display: none; }
  .still .v0, svg.drawing .v0 { animation: none; opacity: 1; }
  svg.sk { position: absolute; overflow: visible; pointer-events: none; }
  .note-m { position: relative; flex: none; display: inline-block; }
  .note-m[hidden] { display: none; }
  .note-m > svg { width: 100%; height: 100%; overflow: visible; display: block; }
  .note-m.nm-sway > svg { animation: nmSway 3.2s ease-in-out infinite; transform-origin: 50% 10%; }
  .note-m.nm-think > svg { animation: nmBob 1.3s ease-in-out infinite; }
  .note-m.nm-sleep > svg { animation: nmBreathe 3s ease-in-out infinite; transform-origin: 50% 90%; }
  .note-m.nm-nod > svg { animation: nmNod .9s cubic-bezier(.3,0,.2,1); transform-origin: 50% 85%; }
  .note-m.nm-hop > svg { animation: nmHop .7s cubic-bezier(.3,0,.2,1); transform-origin: 50% 100%; }
  .note-m.nm-tilt > svg { animation: nmTilt 1s cubic-bezier(.3,0,.2,1) forwards; transform-origin: 50% 80%; }
  .note-m.nm-party > svg { animation: nmParty 1.2s cubic-bezier(.3,0,.2,1); transform-origin: 50% 100%; }
  @keyframes nmBob { 50% { transform: translateY(-6%) rotate(-3deg); } }
  @keyframes nmSway { 50% { transform: rotate(-4deg); } }
  @keyframes nmBreathe { 50% { transform: scale(1.05, .95); } }
  @keyframes nmNod { 0%, 100% { transform: none; } 20% { transform: rotate(-9deg) translateY(3%); } 45% { transform: rotate(6deg); } 70% { transform: rotate(-4deg); } }
  @keyframes nmHop { 0% { transform: none; } 18% { transform: scale(1.12, .86); } 45% { transform: translateY(-28%) scale(.94, 1.08); } 75% { transform: scale(1.08, .92); } 100% { transform: none; } }
  @keyframes nmTilt { 0% { transform: none; } 30% { transform: rotate(15deg); } 55% { transform: rotate(9deg); } 100% { transform: rotate(11deg); } }
  @keyframes nmParty { 0% { transform: none; } 15% { transform: scale(1.15, .82); } 40% { transform: translateY(-40%) rotate(-12deg); } 60% { transform: translateY(-40%) rotate(14deg); } 85% { transform: scale(1.1, .9); } 100% { transform: none; } }
  .zz { position: absolute; right: -8%; top: -14%; font: 700 15px var(--hand); color: var(--ink); pointer-events: none; }
  .zz i { position: absolute; font-style: normal; opacity: 0; animation: nmZz 2.4s linear infinite; }
  .zz i:nth-child(2) { animation-delay: .8s; } .zz i:nth-child(3) { animation-delay: 1.6s; }
  @keyframes nmZz { 0% { opacity: 0; transform: translate(0, 0) scale(.6); } 20% { opacity: 1; } 100% { opacity: 0; transform: translate(16px, -28px) scale(1.25); } }
  .bub { position: absolute; z-index: 40; padding: 8px 13px; font: 14.5px/1.4 var(--hand); white-space: nowrap; pointer-events: none; color: var(--ink); }
